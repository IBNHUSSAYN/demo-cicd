name: CI
#Get trigger whenever changes is commited
on: push
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: Run Bash Script
        run: echo "Goodevening"
      - name: System Info
        run: uname -v
      - name: create file
        run: |
          mkdir myfolder
          sleep 10
  job2:
    name: job2
    runs-on: ubuntu-latest
    steps:
      - name: Greeting message
        run: echo "Here's my first Actions"
      - name: running multiple commands
        run: |
          mkdir player
          pwd
          echo "Today's date is $(date)"
          sleep 5

  job3:
    name: job3
    needs: job2
    runs-on: ubuntu-latest
    steps:
      - name: Hostname
      - run: |
          echo {1..10}
          sleep 10
  job4:
    name: job4
    needs: [job1,job2,job3]
    runs-on: ubuntu-latest
    steps:
      - name: check docker
      - run: |
          command -v docker
          command -v terraform
          echo "End of the script"
          sleep 5
